
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app

  template:
    metadata:
      labels:
        app: app

    spec:
      containers:
        - name: app
          image: app

          ports:
            - name: http
              containerPort: 8080

          # Regular environment variables
          env:
            - name: TEAM_NAME
              value: "grindset"

            - name: OTEL_SERVICE_NAME
              value: "confellow-api"

            - name: DASH0_OTEL_COLLECTOR_BASE_URL
              value: "https://ingress.us-west-2.aws.dash0.com"

            - name: OTEL_LOGS_EXPORTER
              value: "none"

          envFrom:
            - secretRef:
                name: confellow-elastic
            - secretRef:
                name: confellow-dash0

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
